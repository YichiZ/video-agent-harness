[project]
name = "video-agent-harness"
version = "0.1.0"
description = "Chat with an agent about one video: ElevenLabs Scribe, Gemini and the Claude Agent SDK."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.168",
    "elevenlabs>=2.73.1",
    "google-cloud-storage>=3.13",
    "google-genai>=2.31.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "scenedetect[opencv-headless]>=0.7.2",
]

[dependency-groups]
dev = [
    "pexpect>=4.9.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.12.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live tests call real APIs. They run only with `pytest -m live` (the last -m wins).
addopts = "-m 'not live' --strict-markers"
markers = [
    "live: calls the real ElevenLabs, Gemini or Claude APIs (needs keys or the Claude login)",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
# Leave code blocks in the docs alone.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
