name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the UI and Google Chrome for Playwright
        run: |
          npm ci --prefix web
          uv run playwright install --with-deps chrome
      - name: UI unit tests and build
        run: make test-web
      - name: Lint
        run: make lint
      - name: Unit and offline e2e tests
        # No keys and no Video-MME in CI: live tests are deselected and
        # Video-MME tests skip; the generated media stands in.
        run: make test
